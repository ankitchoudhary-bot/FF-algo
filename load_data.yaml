name: Load MNIST Dataset
description: Loads MNIST dataset and saves it to .npy files for downstream use.

inputs: []
outputs:
  - {name: x_train, type: Dataset}
  - {name: y_train, type: Dataset}
  - {name: x_test, type: Dataset}
  - {name: y_test, type: Dataset}

implementation:
  container:
    image: ankitdocker95/mnist-loader:latest
    command:
      - python3
      - -u
      - load_mnist.py  
    args:
      - --x_train
      - {outputPath: x_train}
      - --y_train
      - {outputPath: y_train}
      - --x_test
      - {outputPath: x_test}
      - --y_test
      - {outputPath: y_test}
